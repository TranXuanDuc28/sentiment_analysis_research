# Configuration Optimized for Time and Accuracy

model:
  name: "xlm-roberta-base"
  vi_baseline: "vinai/phobert-base"
  num_labels: 3
  num_domains: 5

training:
  epochs: 10         # Tăng lên 10 cho DANN để hội tụ tốt hơn
  batch_size: 16
  learning_rate: 3e-5
  max_length: 128
  dann_alpha: 1.0

scenarios:
  max_samples_train: 1000  # Reduced to 1000 for better contrast between techniques (Low-resource setup)
  max_samples_test: 1000
  
  # Bật/Tắt các kịch bản tại đây
  run_s1: true   # Baseline
  run_s2: true  # Cross-domain (Có thể bỏ qua)
  run_s3: true  # Multi-domain MDL (Có thể bỏ qua)
  run_s4: true   # DANN Adaptation (BẮT BUỘC)
  run_s5: true   # Cross-lingual (QUAN TRỌNG)
  run_s6: true  # Multilingual (Có thể bỏ qua)
  run_s7: true   # DANN for Low-Resource (QUAN TRỌNG)
  run_s8: true   # Cross-Lingual Adaptation (BẮT BUỘC)
  run_s9: true   # Cross-Lingual + Multilingual (QUAN TRỌNG)
  run_s10: true  # S10a & S10b (Multilingual Cross-Domain)
  run_s11: true  # Model Comparison (mBERT vs XLM-R)
