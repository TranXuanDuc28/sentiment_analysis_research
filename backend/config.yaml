# Configuration Optimized for Time and Accuracy

model:
  name: "xlm-roberta-base"
  vi_baseline: "vinai/phobert-base"
  num_labels: 3
  num_domains: 5

training:
  epochs: 10         # Tăng lên 10 cho DANN để hội tụ tốt hơn
  batch_size: 16
  learning_rate: 3e-5
  max_length: 128
  dann_alpha: 1.0

scenarios:
  base_samples_train: 5000  # 5,000 samples per domain
  base_samples_test: 2000   # 2,000 samples per domain
  few_shot_samples: 500     # 500 samples for Low-resource SFT
  
  # Bật/Tắt các kịch bản tại đây
  run_s1: true   
  run_s2: true  
  run_s3: true  
  run_s4: true   
  run_s5: true   
  run_s6: true  
  run_s7: true   
  run_s8: true   
  run_s9: true   
  run_s10: true  
  run_s11: true  
