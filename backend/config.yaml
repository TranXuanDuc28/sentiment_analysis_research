# Configuration Optimized for Research Narrative
# Phase 1: Multidomain | Phase 2: Multilingual | Phase 3: Combined

model:
  name: "xlm-roberta-base"
  mbert: "bert-base-multilingual-cased"
  num_labels: 3
  num_domains: 5

training:
  epochs: 10         
  batch_size: 16
  learning_rate: 3e-5
  max_length: 128
  dann_alpha: 1.0

scenarios:
  base_samples_train: 5000  
  base_samples_test: 2000   
  few_shot_samples: 500     
  
  # --- PHASE 1: DOMAIN ROBUSTNESS ---
  run_s1: true   # S1 (Zero-shot Domain Transfer: IMDb -> Amazon)
  run_s2: true   # S2 (Domain Adaptation: IMDb+Yelp -> Amazon)
  run_s3: true   # S3 (Multi-task Learning: Sentiment + Domain)

  # --- PHASE 2: MULTILINGUAL ROBUSTNESS ---
  run_s4: true   # S4 (Zero-shot Cross-lingual: EN -> VI)
  run_s5: true   # S5 (Few-shot Fine-tuning: VI)
  run_s6: true   # S6 (Translation-Based Baseline)

  # --- PHASE 3: UNIFIED ROBUSTNESS FRAMEWORK ---
  run_s7: true   # S7 (Unified S+D+L Framework)

  # --- COMPARISON ---
  run_comparison: true # XLM-R vs mBERT on S4 & S7
