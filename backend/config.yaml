# Configuration Optimized for Time and Accuracy

model:
  name: "xlm-roberta-base"
  num_labels: 3
  num_domains: 5

training:
  epochs: 3         # Giảm xuống 3 để tiết kiệm thời gian (vẫn đủ tốt)
  batch_size: 16
  learning_rate: 2e-5
  max_length: 128
  dann_alpha: 1.0

scenarios:
  max_samples_train: 3000  # Giảm xuống 3000 để train nhanh hơn
  max_samples_test: 1000
  
  # Bật/Tắt các kịch bản tại đây
  run_s1: true   # Baseline
  run_s2: false  # Cross-domain (Có thể bỏ qua)
  run_s3: false  # Multi-domain MDL (Có thể bỏ qua)
  run_s4: true   # DANN Adaptation (BẮT BUỘC)
  run_s5: true   # Cross-lingual (QUAN TRỌNG)
  run_s6: false  # Multilingual (Có thể bỏ qua)
