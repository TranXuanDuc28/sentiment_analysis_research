# Configuration for 12-Scenario Research Roadmap
# Phase 1: Multidomain | Phase 2: Multilingual | Phase 3: Unified | Phase 4: Ablation

model:
  name: "xlm-roberta-base"
  mbert: "bert-base-multilingual-cased"
  num_labels: 2
  num_domains: 6
  num_languages: 3

training:
  epochs: 10         
  batch_size: 16
  learning_rate: 3e-5
  max_length: 128

scenarios:
  base_samples_train: 5000  
  base_samples_test: 2000   
  few_shot_samples: 500     
  
  # Grouping for logic (used by main.py)
  groups:
    - "1. Multidomain (S1-S3)"
    - "2. Multilingual (S4-S6)"
    - "3. Unified (S7-S9)"
    - "4. Ablation (S10-S12)"
